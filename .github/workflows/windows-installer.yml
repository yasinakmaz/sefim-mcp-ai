name: Windows installer

# Builds the win-x64 server and packages it into the NSIS setup.
# The publish step is native AOT, so it has to run on a Windows runner.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Setup version (defaults to PackageVersion in the csproj)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          if (-not $version) {
            $csproj = [xml](Get-Content sefim-ai-mcp/sefim-ai-mcp.csproj)
            $version = $csproj.Project.PropertyGroup.PackageVersion | Where-Object { $_ } | Select-Object -First 1
          }
          if (-not $version) { throw 'Version could not be resolved.' }

          # VIProductVersion only accepts x.x.x.x, so the numeric prefix is reused there.
          $numeric = ([regex]::Match($version, '^\d+(\.\d+){0,3}')).Value
          if (-not $numeric) { $numeric = '0.0.0' }
          while (($numeric -split '\.').Count -lt 4) { $numeric = "$numeric.0" }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "numeric=$numeric" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version ($numeric)"

      - name: Restore
        run: dotnet restore sefim-ai-mcp.sln

      - name: Test
        run: dotnet test tests/SefimMcp.Tests/SefimMcp.Tests.csproj -c Release --no-restore

      - name: Test installer configuration helper
        shell: powershell
        run: .\installer\tests\Test-Configure.ps1

      - name: Resolve knowledge pack
        id: pack
        shell: pwsh
        run: |
          # The pack is encrypted; only the SEFIM_KNOWLEDGE_KEY holder can read it.
          # Without it the server starts with no business knowledge, which is a
          # valid but incomplete release, so it is only a warning.
          $pack = 'sefim-ai-mcp/knowledge.pack'
          if (Test-Path $pack) {
            $header = [System.Text.Encoding]::ASCII.GetString([byte[]](Get-Content $pack -AsByteStream -TotalCount 8))
            if ($header -ne 'SEFIMKP1') { throw "knowledge.pack does not carry the SEFIMKP1 header (found: $header)." }
            "allow-missing=false" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "knowledge.pack: $((Get-Item $pack).Length) bytes"
          }
          else {
            "allow-missing=true" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "::warning::knowledge.pack is missing; the setup will ship without business knowledge."
          }

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish sefim-ai-mcp/sefim-ai-mcp.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:AllowMissingKnowledgePack=${{ steps.pack.outputs.allow-missing }} `
            -p:PackageVersion=${{ steps.version.outputs.version }} `
            -o artifacts/win-x64

      - name: Verify payload
        shell: pwsh
        run: |
          $exe = 'artifacts/win-x64/sefim-ai-mcp.exe'
          if (-not (Test-Path $exe)) { throw "Publish output is missing $exe" }
          if (-not (Test-Path 'artifacts/win-x64/appsettings.json')) { throw 'appsettings.json is missing from the payload.' }

          # Knowledge ships only inside the encrypted pack, never as markdown.
          $leak = Get-ChildItem artifacts/win-x64 -Recurse -Include '*.md' -ErrorAction SilentlyContinue
          if ($leak) { throw "Plaintext knowledge in payload: $($leak.FullName -join ', ')" }

          if ('${{ steps.pack.outputs.allow-missing }}' -eq 'false') {
            $packed = 'artifacts/win-x64/knowledge.pack'
            if (-not (Test-Path $packed)) { throw 'knowledge.pack did not reach the publish output.' }
            $header = [System.Text.Encoding]::ASCII.GetString([byte[]](Get-Content $packed -AsByteStream -TotalCount 8))
            if ($header -ne 'SEFIMKP1') { throw 'Published knowledge.pack is not encrypted.' }
          }

          Get-ChildItem artifacts/win-x64 | Select-Object Name, Length | Format-Table

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File $env:GITHUB_PATH -Append

      - name: Build setup
        shell: pwsh
        run: |
          $out = "SefimMcpSetup-${{ steps.version.outputs.version }}-x64.exe"
          makensis /DVERSION=${{ steps.version.outputs.version }} `
                   /DVERSION_NUMERIC=${{ steps.version.outputs.numeric }} `
                   /DPAYLOAD_DIR=..\artifacts\win-x64 `
                   /DOUTPUT_FILE=..\$out `
                   installer\sefim-mcp.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed.' }
          if (-not (Test-Path $out)) { throw "Setup was not produced: $out" }
          Get-Item $out | Select-Object Name, Length | Format-Table

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: SefimMcpSetup-${{ steps.version.outputs.version }}-x64
          path: SefimMcpSetup-${{ steps.version.outputs.version }}-x64.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SefimMcpSetup-${{ steps.version.outputs.version }}-x64.exe
